<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Asset Management - NSC ICT Service Desk</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="app-shell" id="app-shell"></div>

  <div class="modal-overlay" id="asset-modal">
    <div class="modal" style="position:relative;max-width:640px;">
      <span class="close-x" onclick="closeModal()">&times;</span>
      <h3 id="modal-title">Add Asset</h3>
      <div class="error-box" id="modal-error"></div>
      <form id="asset-form">
        <input type="hidden" id="asset_id">
        <div class="form-grid">
          <div class="field"><label>Asset Tag *</label><input id="asset_tag" required placeholder="e.g. NSC-LAP-021"></div>
          <div class="field"><label>Asset Type *</label>
            <select id="asset_type" required>
              <option>Laptop</option><option>Desktop</option><option>Printer</option><option>Scanner</option>
              <option>Router</option><option>Switch</option><option>Server</option><option>Monitor</option>
              <option>UPS</option><option>Projector</option><option>Other</option>
            </select>
          </div>
          <div class="field"><label>Brand</label><input id="brand" placeholder="e.g. Dell"></div>
          <div class="field"><label>Model</label><input id="model" placeholder="e.g. Latitude 5420"></div>
          <div class="field"><label>Serial Number</label><input id="serial_number"></div>
          <div class="field"><label>Department</label><select id="department_id"><option value="">- None -</option></select></div>
          <div class="field"><label>Assigned Staff</label><select id="assigned_to"><option value="">- Unassigned -</option></select></div>
          <div class="field"><label>Purchase Date</label><input type="date" id="purchase_date"></div>
          <div class="field"><label>Condition</label>
            <select id="condition"><option>New</option><option selected>Good</option><option>Fair</option><option>Poor</option></select>
          </div>
          <div class="field"><label>Status</label>
            <select id="status">
              <option>Available</option><option>Active</option><option>Assigned</option>
              <option>Under Maintenance</option><option>Damaged</option><option>Retired</option>
            </select>
          </div>
          <div class="field full"><label>Location</label><input id="location" placeholder="e.g. ICT Office, 2nd Floor"></div>
          <div class="field full"><label>Description</label><textarea id="description" rows="2"></textarea></div>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn secondary" onclick="closeModal()">Cancel</button>
          <button type="submit" class="btn">Save Asset</button>
        </div>
      </form>
    </div>
  </div>

  <div class="modal-overlay" id="history-modal">
    <div class="modal" style="position:relative;max-width:760px;">
      <span class="close-x" onclick="closeHistoryModal()">&times;</span>
      <h3 id="history-title">Asset History</h3>
      <div id="history-body"></div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/layout.js"></script>
  <script>
    requireRoutePage('assets');
    renderLayout('assets', 'Asset Management', 'Visibility and actions follow your backend access scope');

    const user = getUser();
    const accessProfile = getAccessProfile();
    const canManage = hasPermission('can_manage_assets');
    const canDelete = hasPermission('can_access_admin_portal');

    let departments = [];
    let staffList = [];

    async function loadLookups() {
      try {
        departments = await api('/departments');
        document.getElementById('department_id').innerHTML = [
          '<option value="">- None -</option>',
          ...departments.map((department) => `<option value="${department.department_id}">${escapeHtml(department.name)}</option>`),
        ].join('');
      } catch (err) {}

      try {
        staffList = await api('/staff');
        document.getElementById('assigned_to').innerHTML = [
          '<option value="">- Unassigned -</option>',
          ...staffList.map((staff) => `<option value="${staff.user_id}">${escapeHtml(staff.full_name)}</option>`),
        ].join('');
      } catch (err) {}
    }

    function renderContent() {
      document.getElementById('page-content').innerHTML = `
        <div class="panel">
          <div class="toolbar">
            <div class="filters">
              <input type="text" id="search" placeholder="Search tag, brand, model, serial...">
              <select id="filter-status">
                <option value="">All Statuses</option>
                <option>Active</option><option>Available</option><option>Assigned</option>
                <option>Under Maintenance</option><option>Damaged</option><option>Retired</option>
              </select>
              <select id="filter-type">
                <option value="">All Types</option>
                <option>Laptop</option><option>Desktop</option><option>Printer</option><option>Scanner</option>
                <option>Router</option><option>Switch</option><option>Server</option><option>Monitor</option>
                <option>UPS</option><option>Projector</option><option>Other</option>
              </select>
            </div>
            ${canManage ? '<button class="btn" onclick="openModal()">+ Add Asset</button>' : ''}
          </div>
          <div class="table-wrap"><table>
            <thead><tr>
              <th>Tag</th><th>Type</th><th>Brand/Model</th><th>Department</th><th>Assigned To</th>
              <th>Status</th><th>Condition</th><th>Actions</th>
            </tr></thead>
            <tbody id="asset-rows"></tbody>
          </table></div>
          <div id="empty" class="empty-state" style="display:none;">No assets found.</div>
        </div>
      `;

      document.getElementById('search').addEventListener('input', debounce(loadAssets, 350));
      document.getElementById('filter-status').addEventListener('change', loadAssets);
      document.getElementById('filter-type').addEventListener('change', loadAssets);
    }

    function debounce(fn, ms) {
      let timer;
      return (...args) => {
        clearTimeout(timer);
        timer = setTimeout(() => fn(...args), ms);
      };
    }

    async function loadAssets() {
      const params = new URLSearchParams();
      const search = document.getElementById('search').value.trim();
      const status = document.getElementById('filter-status').value;
      const assetType = document.getElementById('filter-type').value;
      if (search) params.set('search', search);
      if (status) params.set('status', status);
      if (assetType) params.set('asset_type', assetType);

      try {
        const assets = await api(`/assets?${params.toString()}`);
        document.getElementById('empty').style.display = assets.length ? 'none' : 'block';
        document.getElementById('asset-rows').innerHTML = assets.map((asset) => `
          <tr>
            <td><b class="mono-tag">${escapeHtml(asset.asset_tag)}</b></td>
            <td>${escapeHtml(asset.asset_type)}</td>
            <td>${escapeHtml(asset.brand || '')} ${escapeHtml(asset.model || '')}</td>
            <td>${escapeHtml(asset.department_name || '-')}</td>
            <td>${escapeHtml(asset.assigned_staff_name || '-')}</td>
            <td><span class="badge ${statusClass(asset.status)}">${escapeHtml(asset.status)}</span></td>
            <td>${escapeHtml(asset.condition)}</td>
            <td>
              <button class="link-btn" onclick="viewHistory(${asset.asset_id}, '${escapeHtml(asset.asset_tag)}')">History</button>
              ${canManage ? `<button class="link-btn" onclick='editAsset(${JSON.stringify(asset)})'>Edit</button>` : ''}
              ${canManage && asset.assigned_to ? `<button class="link-btn" onclick="returnAsset(${asset.asset_id})">Return</button>` : ''}
              ${canDelete ? `<button class="link-btn" style="color:#c0362c" onclick="deleteAsset(${asset.asset_id})">Delete</button>` : ''}
            </td>
          </tr>
        `).join('');
      } catch (err) {
        alert(err.message);
      }
    }

    function openModal() {
      document.getElementById('modal-title').textContent = 'Add Asset';
      document.getElementById('asset-form').reset();
      document.getElementById('asset_id').value = '';
      document.getElementById('modal-error').style.display = 'none';
      document.getElementById('asset-modal').classList.add('open');
    }

    function closeModal() {
      document.getElementById('asset-modal').classList.remove('open');
    }

    function closeHistoryModal() {
      document.getElementById('history-modal').classList.remove('open');
    }

    function editAsset(asset) {
      document.getElementById('modal-title').textContent = `Edit Asset - ${asset.asset_tag}`;
      document.getElementById('asset_id').value = asset.asset_id;
      document.getElementById('asset_tag').value = asset.asset_tag;
      document.getElementById('asset_type').value = asset.asset_type;
      document.getElementById('brand').value = asset.brand || '';
      document.getElementById('model').value = asset.model || '';
      document.getElementById('serial_number').value = asset.serial_number || '';
      document.getElementById('department_id').value = asset.department_id || '';
      document.getElementById('assigned_to').value = asset.assigned_to || '';
      document.getElementById('purchase_date').value = asset.purchase_date ? asset.purchase_date.substring(0, 10) : '';
      document.getElementById('condition').value = asset.condition;
      document.getElementById('status').value = asset.status;
      document.getElementById('location').value = asset.location || '';
      document.getElementById('description').value = asset.description || '';
      document.getElementById('modal-error').style.display = 'none';
      document.getElementById('asset-modal').classList.add('open');
    }

    document.addEventListener('submit', async (event) => {
      if (event.target.id !== 'asset-form') return;
      event.preventDefault();

      const id = document.getElementById('asset_id').value;
      const body = {
        asset_tag: document.getElementById('asset_tag').value.trim(),
        asset_type: document.getElementById('asset_type').value,
        brand: document.getElementById('brand').value.trim(),
        model: document.getElementById('model').value.trim(),
        serial_number: document.getElementById('serial_number').value.trim(),
        department_id: document.getElementById('department_id').value || null,
        assigned_to: document.getElementById('assigned_to').value || null,
        purchase_date: document.getElementById('purchase_date').value || null,
        condition: document.getElementById('condition').value,
        status: document.getElementById('status').value,
        location: document.getElementById('location').value.trim(),
        description: document.getElementById('description').value.trim(),
      };

      const errorBox = document.getElementById('modal-error');
      errorBox.style.display = 'none';

      try {
        if (id) {
          await api(`/assets/${id}`, { method: 'PUT', body });
        } else {
          await api('/assets', { method: 'POST', body });
        }
        closeModal();
        await loadAssets();
      } catch (err) {
        errorBox.textContent = err.message;
        errorBox.style.display = 'block';
      }
    });

    async function deleteAsset(id) {
      if (!confirm('Delete this asset permanently? This cannot be undone.')) return;
      try {
        await api(`/assets/${id}`, { method: 'DELETE' });
        await loadAssets();
      } catch (err) {
        alert(err.message);
      }
    }

    async function returnAsset(id) {
      const returnedCondition = prompt('Returned condition (New, Good, Fair, Poor):', 'Good');
      if (returnedCondition === null) return;
      const returnNotes = prompt('Return notes:', 'Returned to ICT store');
      if (returnNotes === null) return;

      try {
        await api(`/assets/${id}/return`, {
          method: 'PATCH',
          body: {
            returned_condition: returnedCondition,
            return_notes: returnNotes,
          },
        });
        await loadAssets();
      } catch (err) {
        alert(err.message);
      }
    }

    async function viewHistory(id, tag) {
      document.getElementById('history-title').textContent = `Asset History - ${tag}`;
      document.getElementById('history-body').innerHTML = 'Loading...';
      document.getElementById('history-modal').classList.add('open');

      try {
        const asset = await api(`/assets/${id}`);
        const maintenance = asset.maintenance_history || [];
        const assignments = asset.assignment_history || [];
        const statuses = asset.status_history || [];
        const tickets = asset.linked_tickets || [];

        document.getElementById('history-body').innerHTML = `
          <h4>Maintenance</h4>
          ${maintenance.length ? `<table><thead><tr><th>Date</th><th>Problem</th><th>Technician</th><th>Cost</th><th>Status</th></tr></thead>
            <tbody>${maintenance.map((entry) => `
              <tr>
                <td>${fmtDate(entry.maintenance_date)}</td>
                <td>${escapeHtml(entry.problem)}</td>
                <td>${escapeHtml(entry.technician_name || '-')}</td>
                <td>N${Number(entry.cost || 0).toLocaleString()}</td>
                <td><span class="badge ${statusClass(entry.status)}">${escapeHtml(entry.status)}</span></td>
              </tr>
            `).join('')}</tbody></table>` : '<p class="empty-state">No maintenance records for this asset yet.</p>'}

          <h4 style="margin-top:18px;">Assignment History</h4>
          ${assignments.length ? `<div class="comment-list">${assignments.map((entry) => `
            <div class="comment-item">
              <div><strong>${escapeHtml(entry.assigned_user_name || 'Unassigned')}</strong></div>
              <div>${escapeHtml(entry.assignment_notes || 'No assignment note')}</div>
              <small>
                Assigned ${fmtDateTime(entry.assigned_at)}
                ${entry.expected_return_at ? ` | Expected ${fmtDateTime(entry.expected_return_at)}` : ''}
                ${entry.returned_at ? ` | Returned ${fmtDateTime(entry.returned_at)}` : ''}
                ${entry.returned_condition ? ` | Condition ${escapeHtml(entry.returned_condition)}` : ''}
              </small>
            </div>
          `).join('')}</div>` : '<p class="empty-state">No assignment history yet.</p>'}

          <h4 style="margin-top:18px;">Status Timeline</h4>
          ${statuses.length ? `<div class="comment-list">${statuses.map((entry) => `
            <div class="comment-item">
              <div><strong>${escapeHtml(entry.previous_status || 'Start')} -> ${escapeHtml(entry.next_status)}</strong></div>
              <div>${escapeHtml(entry.reason || 'No reason recorded')}</div>
              <small>${escapeHtml(entry.actor_name || 'System')} | ${fmtDateTime(entry.created_at)}</small>
            </div>
          `).join('')}</div>` : '<p class="empty-state">No status history yet.</p>'}

          <h4 style="margin-top:18px;">Linked Tickets</h4>
          ${tickets.length ? `<div class="comment-list">${tickets.map((ticket) => `
            <div class="comment-item">
              <div><strong>${escapeHtml(ticket.ticket_number || `#${ticket.request_id}`)}</strong> - ${escapeHtml(ticket.subject)}</div>
              <small>${escapeHtml(ticket.ticket_type)} | ${escapeHtml(ticket.status)} | ${fmtDateTime(ticket.date_submitted)}</small>
            </div>
          `).join('')}</div>` : '<p class="empty-state">No linked tickets for this asset yet.</p>'}
        `;
      } catch (err) {
        document.getElementById('history-body').innerHTML = `<p style="color:#c0362c">${err.message}</p>`;
      }
    }

    (async () => {
      renderContent();
      await loadLookups();
      await loadAssets();
    })();
  </script>
</body>
</html>
