<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Asset Management — NSC ICT Service Desk</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="app-shell" id="app-shell"></div>

  <div class="modal-overlay" id="asset-modal">
    <div class="modal" style="position:relative;max-width:640px;">
      <span class="close-x" onclick="closeModal()">&times;</span>
      <h3 id="modal-title">Add Asset</h3>
      <div class="error-box" id="modal-error"></div>
      <form id="asset-form">
        <input type="hidden" id="asset_id">
        <div class="form-grid">
          <div class="field"><label>Asset Tag *</label><input id="asset_tag" required placeholder="e.g. NSC-LAP-021"></div>
          <div class="field"><label>Asset Type *</label>
            <select id="asset_type" required>
              <option>Laptop</option><option>Desktop</option><option>Printer</option><option>Scanner</option>
              <option>Router</option><option>Switch</option><option>Server</option><option>Monitor</option>
              <option>UPS</option><option>Projector</option><option>Other</option>
            </select>
          </div>
          <div class="field"><label>Brand</label><input id="brand" placeholder="e.g. Dell"></div>
          <div class="field"><label>Model</label><input id="model" placeholder="e.g. Latitude 5420"></div>
          <div class="field"><label>Serial Number</label><input id="serial_number"></div>
          <div class="field"><label>Department</label><select id="department_id"><option value="">— None —</option></select></div>
          <div class="field"><label>Assigned Staff</label><select id="assigned_to"><option value="">— Unassigned —</option></select></div>
          <div class="field"><label>Purchase Date</label><input type="date" id="purchase_date"></div>
          <div class="field"><label>Condition</label>
            <select id="condition"><option>New</option><option selected>Good</option><option>Fair</option><option>Poor</option></select>
          </div>
          <div class="field"><label>Status</label>
            <select id="status">
              <option>Available</option><option>Active</option><option>Assigned</option>
              <option>Under Maintenance</option><option>Damaged</option><option>Retired</option>
            </select>
          </div>
          <div class="field full"><label>Location</label><input id="location" placeholder="e.g. ICT Office, 2nd Floor"></div>
          <div class="field full"><label>Description</label><textarea id="description" rows="2"></textarea></div>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn secondary" onclick="closeModal()">Cancel</button>
          <button type="submit" class="btn" id="save-btn">Save Asset</button>
        </div>
      </form>
    </div>
  </div>

  <div class="modal-overlay" id="history-modal">
    <div class="modal" style="position:relative;">
      <span class="close-x" onclick="document.getElementById('history-modal').classList.remove('open')">&times;</span>
      <h3 id="history-title">Maintenance History</h3>
      <div id="history-body"></div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/layout.js"></script>
  <script>
    requireAuthPage();
    renderLayout('assets', 'Asset Management');
    const user = getUser();
    const canManage = ['admin', 'ict_officer'].includes(user.role);
    const canDelete = user.role === 'admin';

    let departments = [];
    let staffList = [];

    async function loadLookups() {
      try {
        departments = await api('/departments');
        const deptOpts = departments.map(d => `<option value="${d.department_id}">${escapeHtml(d.name)}</option>`).join('');
        document.getElementById('department_id').innerHTML += deptOpts;
      } catch (e) { /* non-admin may not have department read in some setups; ignore */ }

      try {
        staffList = await api('/staff');
        const staffOpts = staffList.map(s => `<option value="${s.user_id}">${escapeHtml(s.full_name)}</option>`).join('');
        document.getElementById('assigned_to').innerHTML += staffOpts;
      } catch (e) { /* staff-only role can't list staff; fine */ }
    }

    function renderContent() {
      document.getElementById('page-content').innerHTML = `
        <div class="panel">
          <div class="toolbar">
            <div class="filters">
              <input type="text" id="search" placeholder="Search tag, brand, model, serial...">
              <select id="filter-status">
                <option value="">All Statuses</option>
                <option>Active</option><option>Available</option><option>Assigned</option>
                <option>Under Maintenance</option><option>Damaged</option><option>Retired</option>
              </select>
              <select id="filter-type">
                <option value="">All Types</option>
                <option>Laptop</option><option>Desktop</option><option>Printer</option><option>Scanner</option>
                <option>Router</option><option>Switch</option><option>Server</option><option>Monitor</option>
                <option>UPS</option><option>Projector</option><option>Other</option>
              </select>
            </div>
            ${canManage ? '<button class="btn" onclick="openModal()">+ Add Asset</button>' : ''}
          </div>
          <div class="table-wrap"><table>
            <thead><tr>
              <th>Tag</th><th>Type</th><th>Brand/Model</th><th>Department</th><th>Assigned To</th>
              <th>Status</th><th>Condition</th><th>Actions</th>
            </tr></thead>
            <tbody id="asset-rows"></tbody>
          </table></div>
          <div id="empty" class="empty-state" style="display:none;">No assets found.</div>
        </div>
      `;
      document.getElementById('search').addEventListener('input', debounce(loadAssets, 350));
      document.getElementById('filter-status').addEventListener('change', loadAssets);
      document.getElementById('filter-type').addEventListener('change', loadAssets);
    }

    function debounce(fn, ms) {
      let t;
      return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), ms); };
    }

    async function loadAssets() {
      const search = document.getElementById('search').value;
      const status = document.getElementById('filter-status').value;
      const asset_type = document.getElementById('filter-type').value;
      const params = new URLSearchParams();
      if (search) params.set('search', search);
      if (status) params.set('status', status);
      if (asset_type) params.set('asset_type', asset_type);

      try {
        const assets = await api(`/assets?${params.toString()}`);
        const rows = document.getElementById('asset-rows');
        document.getElementById('empty').style.display = assets.length ? 'none' : 'block';
        rows.innerHTML = assets.map(a => `
          <tr>
            <td><b class="mono-tag">${escapeHtml(a.asset_tag)}</b></td>
            <td>${escapeHtml(a.asset_type)}</td>
            <td>${escapeHtml(a.brand || '')} ${escapeHtml(a.model || '')}</td>
            <td>${escapeHtml(a.department_name || '—')}</td>
            <td>${escapeHtml(a.assigned_staff_name || '—')}</td>
            <td><span class="badge ${statusClass(a.status)}">${a.status}</span></td>
            <td>${escapeHtml(a.condition)}</td>
            <td>
              <button class="link-btn" onclick="viewHistory(${a.asset_id}, '${escapeHtml(a.asset_tag)}')">History</button>
              ${canManage ? ` · <button class="link-btn" onclick='editAsset(${JSON.stringify(a)})'>Edit</button>` : ''}
              ${canDelete ? ` · <button class="link-btn" style="color:#c0362c" onclick="deleteAsset(${a.asset_id})">Delete</button>` : ''}
            </td>
          </tr>
        `).join('');
      } catch (err) {
        alert(err.message);
      }
    }

    function openModal() {
      document.getElementById('modal-title').textContent = 'Add Asset';
      document.getElementById('asset-form').reset();
      document.getElementById('asset_id').value = '';
      document.getElementById('modal-error').style.display = 'none';
      document.getElementById('asset-modal').classList.add('open');
    }
    function closeModal() { document.getElementById('asset-modal').classList.remove('open'); }

    function editAsset(a) {
      document.getElementById('modal-title').textContent = `Edit Asset — ${a.asset_tag}`;
      document.getElementById('asset_id').value = a.asset_id;
      document.getElementById('asset_tag').value = a.asset_tag;
      document.getElementById('asset_type').value = a.asset_type;
      document.getElementById('brand').value = a.brand || '';
      document.getElementById('model').value = a.model || '';
      document.getElementById('serial_number').value = a.serial_number || '';
      document.getElementById('department_id').value = a.department_id || '';
      document.getElementById('assigned_to').value = a.assigned_to || '';
      document.getElementById('purchase_date').value = a.purchase_date ? a.purchase_date.substring(0,10) : '';
      document.getElementById('condition').value = a.condition;
      document.getElementById('status').value = a.status;
      document.getElementById('location').value = a.location || '';
      document.getElementById('description').value = a.description || '';
      document.getElementById('modal-error').style.display = 'none';
      document.getElementById('asset-modal').classList.add('open');
    }

    document.addEventListener('submit', async (e) => {
      if (e.target.id !== 'asset-form') return;
      e.preventDefault();
      const id = document.getElementById('asset_id').value;
      const body = {
        asset_tag: document.getElementById('asset_tag').value.trim(),
        asset_type: document.getElementById('asset_type').value,
        brand: document.getElementById('brand').value.trim(),
        model: document.getElementById('model').value.trim(),
        serial_number: document.getElementById('serial_number').value.trim(),
        department_id: document.getElementById('department_id').value || null,
        assigned_to: document.getElementById('assigned_to').value || null,
        purchase_date: document.getElementById('purchase_date').value || null,
        condition: document.getElementById('condition').value,
        status: document.getElementById('status').value,
        location: document.getElementById('location').value.trim(),
        description: document.getElementById('description').value.trim(),
      };
      const errBox = document.getElementById('modal-error');
      errBox.style.display = 'none';
      try {
        if (id) await api(`/assets/${id}`, { method: 'PUT', body });
        else await api('/assets', { method: 'POST', body });
        closeModal();
        loadAssets();
      } catch (err) {
        errBox.textContent = err.message;
        errBox.style.display = 'block';
      }
    });

    async function deleteAsset(id) {
      if (!confirm('Delete this asset permanently? This cannot be undone.')) return;
      try {
        await api(`/assets/${id}`, { method: 'DELETE' });
        loadAssets();
      } catch (err) { alert(err.message); }
    }

    async function viewHistory(id, tag) {
      document.getElementById('history-title').textContent = `Maintenance History — ${tag}`;
      document.getElementById('history-body').innerHTML = 'Loading...';
      document.getElementById('history-modal').classList.add('open');
      try {
        const asset = await api(`/assets/${id}`);
        const h = asset.maintenance_history;
        document.getElementById('history-body').innerHTML = h.length
          ? `<table><thead><tr><th>Date</th><th>Problem</th><th>Action Taken</th><th>Technician</th><th>Cost</th><th>Status</th></tr></thead>
             <tbody>${h.map(m => `<tr>
                <td>${fmtDate(m.maintenance_date)}</td><td>${escapeHtml(m.problem)}</td>
                <td>${escapeHtml(m.action_taken || '—')}</td><td>${escapeHtml(m.technician_name || '—')}</td>
                <td>₦${Number(m.cost).toLocaleString()}</td>
                <td><span class="badge ${statusClass(m.status)}">${m.status}</span></td>
             </tr>`).join('')}</tbody></table>`
          : '<p class="empty-state">No maintenance records for this asset yet.</p>';
      } catch (err) {
        document.getElementById('history-body').innerHTML = `<p style="color:#c0362c">${err.message}</p>`;
      }
    }

    (async () => {
      renderContent();
      await loadLookups();
      await loadAssets();
    })();
  </script>
</body>
</html>
