<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dashboard — NSC ICT Service Desk</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="app-shell" id="app-shell"></div>

  <script src="/js/api.js"></script>
  <script src="/js/layout.js"></script>
  <script>
    requireAuthPage();
    renderLayout('dashboard', 'Dashboard');
    const user = getUser();

    const ICONS = {
      box: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5M12 22V12"/></svg>',
      pulse: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>',
      check: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>',
      wrench: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>',
      alert: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.46 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><path d="M12 9v4M12 17h.01"/></svg>',
      archive: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="5" rx="1"/><path d="M4 8v11a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8M10 13h4"/></svg>',
      ticket: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3v4a1 1 0 0 0 1 1h4"/><path d="M17 21H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h7l5 5v11a2 2 0 0 1-2 2Z"/></svg>',
      clock: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>',
      users: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>',
      tool: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>',
    };

    function card(icon, label, value, accent) {
      return `<div class="stat-card ${accent || ''}">
        <div class="icon-badge">${ICONS[icon]}</div>
        <div><div class="label">${label}</div><div class="value">${value}</div></div>
      </div>`;
    }

    async function load() {
      const content = document.getElementById('page-content');
      content.innerHTML = '<p style="color:#647089">Loading statistics...</p>';
      try {
        const s = await api('/dashboard/stats');
        content.innerHTML = `
          <p style="color:#647089;margin-top:-6px;">Welcome back, ${escapeHtml(user.full_name)}. Here is a live snapshot of the system.</p>

          <div class="section-title">Asset Overview</div>
          <div class="stat-grid">
            ${card('box', 'Total Assets', s.total_assets)}
            ${card('check', 'Active Assets', s.active_assets, 'accent-green')}
            ${card('archive', 'Available Assets', s.available_assets)}
            ${card('wrench', 'Under Maintenance', s.maintenance_assets, 'accent-orange')}
            ${card('alert', 'Damaged Assets', s.damaged_assets, 'accent-red')}
            ${card('archive', 'Retired Assets', s.retired_assets)}
          </div>

          <div class="section-title">Service Desk Overview</div>
          <div class="stat-grid">
            ${card('ticket', 'Total Requests', s.total_requests)}
            ${card('clock', 'Pending Requests', s.pending_requests, 'accent-orange')}
            ${card('pulse', 'In Progress', s.in_progress_requests, 'accent-orange')}
            ${card('check', 'Resolved', s.resolved_requests, 'accent-green')}
          </div>

          <div class="section-title">Workforce Overview</div>
          <div class="stat-grid">
            ${card('users', 'Total Staff', s.total_staff)}
            ${card('tool', 'Total Technicians', s.total_technicians)}
          </div>

          <p style="color:#98a2b3;font-size:12.5px;margin-top:10px;">
            All figures above are calculated live from the PostgreSQL database and update automatically as records are added, edited, or change status.
          </p>
        `;
      } catch (err) {
        content.innerHTML = `<p style="color:#c1432d">${err.message}</p>`;
      }
    }
    load();
  </script>
</body>
</html>
