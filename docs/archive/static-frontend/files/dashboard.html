<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dashboard - NSC ICT Service Desk</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="/css/style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
</head>
<body>
  <div class="app-shell" id="app-shell"></div>

  <script src="/js/api.js"></script>
  <script src="/js/layout.js"></script>
  <script>
    requireRoutePage('dashboard');
    renderLayout('dashboard', 'Dashboard', 'Role-based operational overview');

    const user = getUser();
    const accessProfile = getAccessProfile();
    let chartRegistry = [];
    let filterData = { departments: [], technicians: [] };

    const ICONS = {
      box: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5M12 22V12"/></svg>',
      pulse: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>',
      check: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6 9 17l-5-5"/></svg>',
      wrench: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>',
      alert: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m21.73 18-8-14a2 2 0 0 0-3.46 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><path d="M12 9v4M12 17h.01"/></svg>',
      ticket: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 3v4a1 1 0 0 0 1 1h4"/><path d="M17 21H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h7l5 5v11a2 2 0 0 1-2 2Z"/></svg>',
      clock: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>',
    };

    function renderContent() {
      const showGlobalFilters = hasPermission('can_view_reports');
      document.getElementById('page-content').innerHTML = `
        <div class="page-hero">
          <div>
            <div class="page-hero-eyebrow">${escapeHtml(accessProfile.role_label)}</div>
            <h3>${escapeHtml(portalHeading())}</h3>
            <p>${escapeHtml(portalSummary())}</p>
          </div>
          <div class="page-hero-meta">
            <span class="chip">${escapeHtml(portalScope())}</span>
            <span class="chip">${escapeHtml(user.user_type || 'internal user')}</span>
          </div>
        </div>
        <div class="toolbar">
          <div class="filters">
            <input id="date_from" type="date">
            <input id="date_to" type="date">
            ${showGlobalFilters ? '<select id="department_id"><option value="">All Departments</option></select>' : ''}
            ${showGlobalFilters ? '<select id="technician_id"><option value="">All Technicians</option></select>' : ''}
            <select id="category"><option value="">All Categories</option><option>Computer</option><option>Network</option><option>Printer</option><option>Internet</option><option>Software</option><option>Email</option><option>Hardware</option><option>Other</option></select>
            <select id="ticket_type"><option value="">All Ticket Types</option><option>Incident</option><option>Service Request</option><option>Access Request</option><option>Maintenance Request</option><option>Change Request</option></select>
          </div>
          <div class="filters">
            <button class="btn secondary" onclick="resetFilters()">Reset</button>
            <button class="btn" onclick="loadDashboard()">Apply Filters</button>
          </div>
        </div>

        <div id="dashboard-summary"></div>

        <div class="grid-2" style="margin-top:18px;">
          <div class="panel"><h3>Tickets by Status</h3><canvas id="chart-ticket-status"></canvas></div>
          <div class="panel"><h3>Tickets by Priority</h3><canvas id="chart-ticket-priority"></canvas></div>
          <div class="panel"><h3>Assets by Status</h3><canvas id="chart-asset-status"></canvas></div>
          <div class="panel"><h3>Technician Workload</h3><canvas id="chart-technician"></canvas></div>
        </div>
      `;
    }

    function portalHeading() {
      return {
        administrator: 'Administrator command view',
        ict_officer: 'ICT operations command view',
        technician: 'Technician workload view',
        department_supervisor: 'Department service view',
        staff: 'Self-service workspace',
      }[accessProfile.primary_portal] || 'Operational workspace';
    }

    function portalSummary() {
      if (accessProfile.scope.organization_scope) {
        return 'This dashboard reflects organization-wide assets, ticket flow, SLA performance, and maintenance activity within the selected filters.';
      }
      if (accessProfile.scope.assigned_only) {
        return 'This dashboard is limited to tickets assigned to you and the maintenance work you are responsible for.';
      }
      if (accessProfile.scope.department_scope) {
        return 'This dashboard reflects only the department and personal records available to your current access scope.';
      }
      return 'This dashboard reflects your own tickets, visible assets, and the support activity you are allowed to review.';
    }

    function portalScope() {
      if (accessProfile.scope.organization_scope) return 'Organization scope';
      if (accessProfile.scope.assigned_only) return 'Assigned-only scope';
      if (accessProfile.scope.department_scope) return 'Department scope';
      return 'Self-service scope';
    }

    function getFilters() {
      const params = new URLSearchParams();
      ['date_from', 'date_to', 'department_id', 'technician_id', 'category', 'ticket_type'].forEach((key) => {
        const node = document.getElementById(key);
        if (node && node.value) params.set(key, node.value);
      });
      return params;
    }

    function resetFilters() {
      ['date_from', 'date_to', 'department_id', 'technician_id', 'category', 'ticket_type'].forEach((key) => {
        const node = document.getElementById(key);
        if (node) node.value = '';
      });
      loadDashboard();
    }

    function card(icon, label, value, subtitle = '') {
      return `<div class="stat-card">
        <div class="icon-badge">${ICONS[icon] || ICONS.ticket}</div>
        <div><div class="label">${label}</div><div class="value">${value}</div>${subtitle ? `<div class="muted">${subtitle}</div>` : ''}</div>
      </div>`;
    }

    function destroyCharts() {
      chartRegistry.forEach((chart) => chart.destroy());
      chartRegistry = [];
    }

    function makeChart(canvasId, labels, data, type = 'doughnut') {
      const canvas = document.getElementById(canvasId);
      if (!canvas) return;
      const chart = new Chart(canvas, {
        type,
        data: {
          labels,
          datasets: [{
            data,
            backgroundColor: ['#0a7d3e', '#14904a', '#f4a300', '#c0362c', '#2fae66', '#5c6b62', '#8fe0ad'],
            borderWidth: 0,
          }],
        },
        options: {
          plugins: { legend: { display: true } },
          scales: type === 'bar' ? { y: { beginAtZero: true, ticks: { precision: 0 } } } : {},
        },
      });
      chartRegistry.push(chart);
    }

    function renderSummary(data) {
      const responseRate = data.response_sla_met_rate === null ? '-' : `${Math.round(data.response_sla_met_rate * 100)}%`;
      const resolutionRate = data.resolution_sla_met_rate === null ? '-' : `${Math.round(data.resolution_sla_met_rate * 100)}%`;
      document.getElementById('dashboard-summary').innerHTML = `
        <p class="muted">Metrics reflect the current filtered scope. Ticket date filtering uses submission date, asset filtering uses date added, and maintenance filtering uses maintenance date.</p>
        <div class="section-title">Operational Snapshot</div>
        <div class="stat-grid">
          ${card('ticket', 'Total Requests', data.total_requests)}
          ${card('clock', 'Pending Requests', data.pending_requests)}
          ${card('pulse', 'Active Work', data.in_progress_requests)}
          ${card('check', 'Resolved', data.resolved_requests)}
          ${card('alert', 'Overdue', data.overdue_requests)}
          ${card('alert', 'Escalated', data.escalated_requests)}
        </div>
        <div class="section-title">SLA and Maintenance</div>
        <div class="stat-grid">
          ${card('check', 'Response SLA Met', responseRate)}
          ${card('check', 'Resolution SLA Met', resolutionRate)}
          ${card('clock', 'Avg Resolution Hours', data.avg_resolution_hours === null ? '-' : data.avg_resolution_hours.toFixed(1))}
          ${card('wrench', 'Maintenance Records', data.maintenance_total_records)}
          ${card('wrench', 'Maintenance Cost', `NGN ${Number(data.maintenance_total_cost || 0).toLocaleString()}`)}
          ${card('alert', 'Due Maintenance', data.due_maintenance_schedules)}
        </div>
        <div class="section-title">Assets</div>
        <div class="stat-grid">
          ${card('box', 'Total Assets', data.total_assets)}
          ${card('check', 'Active Assets', data.active_assets)}
          ${card('box', 'Available Assets', data.available_assets)}
          ${card('box', 'Assigned Assets', data.assigned_assets)}
          ${card('wrench', 'Under Maintenance', data.maintenance_assets)}
          ${card('alert', 'Damaged / Retired', `${data.damaged_assets} / ${data.retired_assets}`)}
        </div>
      `;
    }

    async function loadFilterOptions() {
      if (!hasPermission('can_view_reports')) return;
      try {
        filterData = await api('/reports/filters');
        const departmentNode = document.getElementById('department_id');
        const technicianNode = document.getElementById('technician_id');
        if (departmentNode) {
          departmentNode.innerHTML += filterData.departments.map((department) => `<option value="${department.department_id}">${escapeHtml(department.name)}</option>`).join('');
        }
        if (technicianNode) {
          technicianNode.innerHTML += filterData.technicians.map((technician) => `<option value="${technician.user_id}">${escapeHtml(technician.full_name)}</option>`).join('');
        }
      } catch (err) {}
    }

    async function loadDashboard() {
      try {
        const params = getFilters();
        const data = await api(`/dashboard/stats?${params.toString()}`);
        destroyCharts();
        renderSummary(data);
        makeChart('chart-ticket-status', data.tickets_by_status.map((row) => row.status), data.tickets_by_status.map((row) => Number(row.total || 0)));
        makeChart('chart-ticket-priority', data.tickets_by_priority.map((row) => row.priority), data.tickets_by_priority.map((row) => Number(row.total || 0)));
        makeChart('chart-asset-status', data.assets_by_status.map((row) => row.status), data.assets_by_status.map((row) => Number(row.total || 0)));
        makeChart('chart-technician', (data.technician_workload || []).map((row) => row.technician), (data.technician_workload || []).map((row) => Number(row.open_requests || 0)), 'bar');
      } catch (err) {
        document.getElementById('dashboard-summary').innerHTML = `<p style="color:#c0362c">${err.message}</p>`;
      }
    }

    async function init() {
      renderContent();
      await loadFilterOptions();
      await loadDashboard();
    }

    init();
  </script>
</body>
</html>
