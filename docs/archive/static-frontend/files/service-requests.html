<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Service Desk - NSC ICT Service Desk</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="app-shell" id="app-shell"></div>

  <div class="modal-overlay" id="new-modal">
    <div class="modal" style="position:relative;max-width:640px;">
      <span class="close-x" onclick="closeNewModal()">&times;</span>
      <h3>Create Ticket</h3>
      <div class="error-box" id="new-error"></div>
      <form id="new-form" class="form-stack">
        <div class="field">
          <label>Ticket Type *</label>
          <select id="ticket_type" required></select>
        </div>
        <div class="field">
          <label>Category *</label>
          <select id="category" required>
            <option>Computer</option><option>Network</option><option>Printer</option><option>Internet</option>
            <option>Software</option><option>Email</option><option>Hardware</option><option>Other</option>
          </select>
        </div>
        <div class="field">
          <label>Subcategory</label>
          <input id="subcategory" placeholder="Optional refinement, e.g. VPN, laptop, access reset">
        </div>
        <div class="field">
          <label>Priority *</label>
          <select id="priority"></select>
        </div>
        <div class="field">
          <label>Impact</label>
          <select id="impact"></select>
        </div>
        <div class="field">
          <label>Urgency</label>
          <select id="urgency"></select>
        </div>
        <div class="field">
          <label>Subject *</label>
          <input id="subject" required placeholder="Brief summary of the issue">
        </div>
        <div class="field">
          <label>Description *</label>
          <textarea id="description" rows="5" required placeholder="Describe the issue in detail"></textarea>
        </div>
        <div class="field">
          <label>Affected Asset</label>
          <select id="affected_asset_id">
            <option value="">No linked asset</option>
          </select>
        </div>
        <div class="detail-block detail-block-reset">
          <strong>Suggested Knowledge Articles</strong>
          <div id="ticket-suggestions" class="comment-list" style="margin-top:10px;">
            <div class="muted">Suggestions will appear as you describe the issue.</div>
          </div>
        </div>
        <div class="field">
          <label><input id="closure_confirmation_required" type="checkbox"> Require requester closure confirmation</label>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn secondary" onclick="closeNewModal()">Cancel</button>
          <button type="submit" class="btn">Create Ticket</button>
        </div>
      </form>
    </div>
  </div>

  <div class="modal-overlay" id="assign-modal">
    <div class="modal" style="position:relative;max-width:430px;">
      <span class="close-x" onclick="UiModals.close('assign-modal')">&times;</span>
      <h3>Assign Technician</h3>
      <div class="field"><label>Technician</label><select id="tech-select"></select></div>
      <div class="field"><label>Expected Completion</label><input id="expected_completion_at" type="datetime-local"></div>
      <div class="field"><label>Assignment Note</label><textarea id="assignment_note" rows="3" placeholder="Optional note for the assignee"></textarea></div>
      <div class="modal-actions">
        <button type="button" class="btn secondary" onclick="UiModals.close('assign-modal')">Cancel</button>
        <button type="button" class="btn" onclick="confirmAssign()">Assign</button>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/permissions.js"></script>
  <script src="/js/ui/badges.js"></script>
  <script src="/js/ui/feedback.js"></script>
  <script src="/js/ui/modals.js"></script>
  <script src="/js/ui/states.js"></script>
  <script src="/js/ui/tables.js"></script>
  <script>
    requireRoutePage('service-requests');
    renderLayout('service-requests', 'Service Desk', 'Ticket workflows, assignment, comments, and secure history');

    const user = getUser();
    const accessProfile = getAccessProfile();
    let activeAssignId = null;
    let selectedTicketId = null;
    let currentDetail = null;
    let assetOptions = [];
    let suggestionTimer = null;
    let metadata = {
      priorities: ['Low', 'Medium', 'High', 'Critical'],
      statuses: ['New', 'Pending', 'Assigned', 'Accepted', 'In Progress', 'Waiting for User', 'Waiting for Parts', 'Resolved', 'Closed', 'Reopened', 'Cancelled'],
      ticket_types: ['Incident', 'Service Request', 'Access Request', 'Maintenance Request', 'Change Request'],
    };

    function getDetailEmptyMessage() {
      return 'Select a ticket to view its timeline, comments, notes, and attachments.';
    }

    function closeNewModal() {
      UiModals.close('new-modal');
    }

    function renderContent() {
      document.getElementById('page-content').innerHTML = `
        <div class="service-grid">
          <div class="panel">
            <div class="toolbar">
              <div class="filters">
                <select id="filter-type"></select>
                <select id="filter-status"></select>
                <select id="filter-priority"></select>
              </div>
              <div class="inline-actions">
                <label class="muted"><input type="checkbox" id="filter-mine"> Only my tickets</label>
                <button class="btn" onclick="openNewModal()">+ New Ticket</button>
              </div>
            </div>
            <div class="table-wrap"><table>
              <thead><tr>
                <th>Ticket</th><th>Type</th><th>Subject</th><th>Priority</th><th>Status</th><th>Assignee</th><th>Expected</th><th>Submitted</th><th>Actions</th>
              </tr></thead>
              <tbody id="rows"></tbody>
            </table></div>
            <div id="empty" class="empty-state" style="display:none;">No tickets found for the current filters.</div>
          </div>
          <div class="panel detail-panel">
            <div id="detail-root" class="detail-empty">${escapeHtml(getDetailEmptyMessage())}</div>
          </div>
        </div>
      `;

      populateFilters();
      document.getElementById('filter-type').addEventListener('change', load);
      document.getElementById('filter-status').addEventListener('change', load);
      document.getElementById('filter-priority').addEventListener('change', load);
      document.getElementById('filter-mine').addEventListener('change', load);
    }

    function populateFilters() {
      document.getElementById('filter-type').innerHTML = `<option value="">All Types</option>${metadata.ticket_types.map((value) => `<option>${escapeHtml(value)}</option>`).join('')}`;
      document.getElementById('filter-status').innerHTML = `<option value="">All Statuses</option>${metadata.statuses.map((value) => `<option>${escapeHtml(value)}</option>`).join('')}`;
      document.getElementById('filter-priority').innerHTML = `<option value="">All Priorities</option>${metadata.priorities.map((value) => `<option>${escapeHtml(value)}</option>`).join('')}`;

      document.getElementById('ticket_type').innerHTML = metadata.ticket_types.map((value) => `<option>${escapeHtml(value)}</option>`).join('');
      document.getElementById('priority').innerHTML = metadata.priorities.map((value) => `<option ${value === 'Medium' ? 'selected' : ''}>${escapeHtml(value)}</option>`).join('');
      document.getElementById('impact').innerHTML = metadata.priorities.map((value) => `<option ${value === 'Medium' ? 'selected' : ''}>${escapeHtml(value)}</option>`).join('');
      document.getElementById('urgency').innerHTML = metadata.priorities.map((value) => `<option ${value === 'Medium' ? 'selected' : ''}>${escapeHtml(value)}</option>`).join('');
    }

    async function loadAssetOptions() {
      try {
        assetOptions = await api('/assets');
      } catch (err) {
        assetOptions = [];
      }

      const html = ['<option value="">No linked asset</option>']
        .concat(assetOptions.map((asset) => `<option value="${asset.asset_id}">${escapeHtml(asset.asset_tag)} - ${escapeHtml(asset.asset_type)}</option>`))
        .join('');

      const createSelect = document.getElementById('affected_asset_id');
      if (createSelect) {
        createSelect.innerHTML = html;
      }

      const detailSelect = document.getElementById('detail-affected-asset');
      if (detailSelect) {
        detailSelect.innerHTML = html;
        detailSelect.value = currentDetail?.affected_asset_id || '';
      }
    }

    async function openNewModal() {
      document.getElementById('new-form').reset();
      UiFeedback.clearBox('new-error');
      populateFilters();
      await loadAssetOptions();
      UiModals.open('new-modal');
      bindSuggestionInputs();
      renderKnowledgeSuggestions([], 'ticket-suggestions');
    }

    function debounce(fn, ms) {
      return (...args) => {
        clearTimeout(suggestionTimer);
        suggestionTimer = setTimeout(() => fn(...args), ms);
      };
    }

    function bindSuggestionInputs() {
      ['category', 'subcategory', 'subject', 'description', 'affected_asset_id'].forEach((id) => {
        const node = document.getElementById(id);
        if (!node) return;
        const handler = debounce(loadTicketCreationSuggestions, 250);
        node.oninput = handler;
        node.onchange = handler;
      });
    }

    async function loadMetadata() {
      try {
        metadata = await api('/service-requests/metadata/options');
      } catch (err) {
        console.warn('Failed to load ticket metadata:', err.message);
      }
    }

    function renderAssignmentAction(ticket) {
      if (!isActionAllowed('can_manage_service_request_assignments', !['Closed', 'Cancelled'].includes(ticket.status))) {
        return '';
      }

      return `<button class="link-btn" onclick="openAssign(${ticket.request_id})">${ticket.assigned_technician_id ? 'Reassign' : 'Assign'}</button>`;
    }

    function renderRowActions(ticket) {
      const assignAction = renderAssignmentAction(ticket);
      return `${assignAction ? `${assignAction} ` : ''}<button class="link-btn" onclick="selectTicket(${ticket.request_id})">Open</button>`;
    }

    function renderTicketRow(ticket) {
      return `
        <tr class="${selectedTicketId === ticket.request_id ? 'row-active' : ''}">
          <td><button class="link-btn" onclick="selectTicket(${ticket.request_id})">${escapeHtml(ticket.ticket_number || `#${ticket.request_id}`)}</button></td>
          <td>${escapeHtml(ticket.ticket_type || 'Incident')}</td>
          <td>${escapeHtml(ticket.subject)}</td>
          <td>${UiBadges.renderPriority(ticket.priority)}</td>
          <td>${UiBadges.renderStatus(ticket.status)}</td>
          <td>${escapeHtml(ticket.technician_name || 'Unassigned')}</td>
          <td>${fmtDateTime(ticket.expected_completion_at)}</td>
          <td>${fmtDateTime(ticket.date_submitted)}</td>
          <td>${renderRowActions(ticket)}</td>
        </tr>
      `;
    }

    async function load() {
      const params = new URLSearchParams();
      const status = document.getElementById('filter-status').value;
      const priority = document.getElementById('filter-priority').value;
      const ticketType = document.getElementById('filter-type').value;
      const mine = document.getElementById('filter-mine').checked;
      if (status) params.set('status', status);
      if (priority) params.set('priority', priority);
      if (ticketType) params.set('ticket_type', ticketType);
      if (mine) params.set('mine', 'true');

      try {
        const list = await api(`/service-requests?${params.toString()}`);
        UiTables.renderBody('rows', 'empty', list.map(renderTicketRow).join(''), 'No tickets found for the current filters.');

        if (selectedTicketId && !list.some((ticket) => ticket.request_id === selectedTicketId)) {
          selectedTicketId = null;
          currentDetail = null;
          renderDetail();
        }
      } catch (err) {
        alert(err.message);
      }
    }

    async function selectTicket(id) {
      selectedTicketId = id;
      await load();
      try {
        currentDetail = await api(`/service-requests/${id}`);
        renderDetail();
      } catch (err) {
        alert(err.message);
      }
    }

    function renderAssignmentHistory(entries = []) {
      return entries.length
        ? entries.map((entry) => `
          <div class="timeline-item">
            <div><strong>${escapeHtml(entry.technician_name || 'Unassigned')}</strong></div>
            <div>${escapeHtml(entry.assignment_notes || 'No assignment note')}</div>
            <small>
              Assigned by ${escapeHtml(entry.assigned_by_name || 'System')}
              on ${fmtDateTime(entry.assigned_at)}
              ${entry.expected_completion_at ? ` | Expected ${fmtDateTime(entry.expected_completion_at)}` : ''}
              ${entry.accepted_at ? ` | Accepted ${fmtDateTime(entry.accepted_at)}` : ''}
              ${entry.ended_at ? ` | Ended ${fmtDateTime(entry.ended_at)}` : ''}
            </small>
          </div>
        `).join('')
        : UiFeedback.renderMuted('No assignment history yet.');
    }

    function renderComments(comments = []) {
      return comments.length
        ? comments.map((comment) => `
          <div class="comment-item">
            ${comment.is_internal ? '<div class="artifact-flag">Internal Note</div>' : ''}
            <div>${escapeHtml(comment.comment_body)}</div>
            <small>${escapeHtml(comment.author_name || 'System')} - ${fmtDateTime(comment.created_at)}</small>
          </div>
        `).join('')
        : UiFeedback.renderMuted('No comments or notes yet.');
    }

    function renderAttachments(attachments = []) {
      return attachments.length
        ? attachments.map((attachment) => `
          <div class="attachment-item">
            ${attachment.is_internal ? '<div class="artifact-flag">Internal Attachment</div>' : ''}
            <div><strong>${escapeHtml(attachment.file_name)}</strong></div>
            <small>${escapeHtml(attachment.uploaded_by_name || 'System')} - ${fmtDateTime(attachment.created_at)} - ${attachment.file_size_bytes || 0} bytes</small>
            <button class="link-btn" onclick="downloadAttachment(${attachment.attachment_id}, '${escapeHtml(attachment.file_name).replace(/'/g, '&#39;')}')">Download</button>
          </div>
        `).join('')
        : UiFeedback.renderMuted('No attachments yet.');
    }

    function renderTimeline(history = []) {
      return history.length
        ? history.map((entry) => `
          <div class="timeline-item">
            <div><strong>${escapeHtml(entry.event_type.replace(/_/g, ' '))}</strong></div>
            <div>${entry.from_status || entry.to_status ? `${escapeHtml(entry.from_status || '-')} -> ${escapeHtml(entry.to_status || '-')}` : ''}</div>
            ${entry.details ? `<div style="margin-top:6px;">${escapeHtml(entry.details)}</div>` : ''}
            <small>${escapeHtml(entry.actor_name || 'System')} - ${fmtDateTime(entry.created_at)}</small>
          </div>
        `).join('')
        : UiFeedback.renderMuted('No timeline entries yet.');
    }

    function renderDetail() {
      const root = document.getElementById('detail-root');
      if (!currentDetail) {
        root.className = 'detail-empty';
        root.innerHTML = escapeHtml(getDetailEmptyMessage());
        return;
      }

      root.className = '';
      root.innerHTML = `
        <div>
          <h3 style="margin-bottom:6px;">${escapeHtml(currentDetail.ticket_number || `#${currentDetail.request_id}`)} - ${escapeHtml(currentDetail.subject)}</h3>
          <div class="inline-actions">
            ${UiBadges.renderStatus(currentDetail.status)}
            ${UiBadges.renderPriority(currentDetail.priority)}
            ${UiBadges.renderBadge(currentDetail.ticket_type)}
          </div>
          <div class="ticket-kpis">
            <div class="ticket-kpi"><span>Requester</span><strong>${escapeHtml(currentDetail.requester_name || '-')}</strong></div>
            <div class="ticket-kpi"><span>Technician</span><strong>${escapeHtml(currentDetail.technician_name || 'Unassigned')}</strong></div>
            <div class="ticket-kpi"><span>Department</span><strong>${escapeHtml(currentDetail.department_name || '-')}</strong></div>
            <div class="ticket-kpi"><span>Created</span><strong>${fmtDateTime(currentDetail.date_submitted)}</strong></div>
            <div class="ticket-kpi"><span>Expected Completion</span><strong>${fmtDateTime(currentDetail.expected_completion_at)}</strong></div>
            <div class="ticket-kpi"><span>Escalations</span><strong>${currentDetail.sla?.escalation_count || 0}</strong></div>
          </div>

          <div class="detail-meta">
            <div><strong>Category</strong>${escapeHtml(currentDetail.category)}${currentDetail.subcategory ? ` / ${escapeHtml(currentDetail.subcategory)}` : ''}</div>
            <div><strong>Impact / Urgency</strong>${escapeHtml(currentDetail.impact || '-')} / ${escapeHtml(currentDetail.urgency || '-')}</div>
            <div><strong>Source Channel</strong>${escapeHtml(currentDetail.source_channel || '-')}</div>
            <div><strong>Affected Asset</strong>${escapeHtml(currentDetail.affected_asset_tag || (currentDetail.affected_asset_id ? `Asset #${currentDetail.affected_asset_id}` : '-'))}</div>
            <div><strong>First Response</strong>${fmtDateTime(currentDetail.first_response_at)}</div>
            <div><strong>Resolution Due</strong>${fmtDateTime(currentDetail.sla_resolution_due_at)}</div>
            <div><strong>Response Due</strong>${fmtDateTime(currentDetail.sla_response_due_at)}</div>
            <div><strong>Assigned By</strong>${escapeHtml(currentDetail.assigned_by_name || '-')}</div>
          </div>

          <div class="detail-block">
            <strong>Description</strong>
            <p class="detail-copy">${escapeHtml(currentDetail.description)}</p>
          </div>

          <div class="detail-block">
            <strong>Asset Link</strong>
            <div class="inline-actions" style="margin-top:10px;">
              <select id="detail-affected-asset">
                <option value="">No linked asset</option>
              </select>
              <button class="btn" onclick="submitAffectedAssetUpdate()">Save Asset Link</button>
            </div>
          </div>

          <div class="detail-block">
            <strong>Suggested Knowledge Articles</strong>
            <div id="detail-suggestions" class="comment-list" style="margin-top:10px;">
              ${UiFeedback.renderMuted('Loading suggestions...')}
            </div>
          </div>

          <div class="detail-block">
            <strong>Workflow</strong>
            <div class="form-stack" style="margin-top:10px;">
              <div class="inline-actions">
                <select id="status-select">
                  <option value="">Change status...</option>
                  ${(currentDetail.permissions?.allowed_status_transitions || []).map((status) => `<option>${escapeHtml(status)}</option>`).join('')}
                </select>
                <button class="btn" onclick="submitStatusChange()">Apply</button>
              </div>
              <textarea id="status-note" rows="3" placeholder="Status note, reopen reason, cancellation reason, or resolution context"></textarea>
              <textarea id="status-resolution" rows="3" placeholder="Resolution text when resolving or closing"></textarea>
            </div>
          </div>

          <div class="detail-block">
            <strong>SLA And Ownership</strong>
            <div class="detail-meta" style="margin-top:10px;">
              <div><strong>SLA Policy</strong>${escapeHtml(currentDetail.sla?.policy_name || 'Unmapped')}</div>
              <div><strong>Response Overdue</strong>${currentDetail.sla?.responseOverdue ? 'Yes' : 'No'}</div>
              <div><strong>Resolution Overdue</strong>${currentDetail.sla?.resolutionOverdue ? 'Yes' : 'No'}</div>
              <div><strong>Expected Completion Overdue</strong>${currentDetail.sla?.expectedCompletionOverdue ? 'Yes' : 'No'}</div>
            </div>
            <div class="timeline-list" style="margin-top:12px;">
              ${renderAssignmentHistory(currentDetail.assignment_history)}
            </div>
          </div>

          <div class="detail-block">
            <strong>Comments And Notes</strong>
            <div class="form-stack" style="margin-top:10px;">
              <textarea id="comment-body" rows="3" placeholder="Add an update or question"></textarea>
              <label class="muted"><input type="checkbox" id="comment-internal" ${currentDetail.permissions?.can_add_internal_note ? '' : 'disabled'}> Internal ICT note</label>
              <div class="inline-actions">
                <button class="btn" onclick="submitComment()">Post Comment</button>
                <span class="muted">Internal notes are visible only to ICT officers, administrators, and the assigned technician.</span>
              </div>
            </div>
            <div class="comment-list">
              ${renderComments(currentDetail.comments)}
            </div>
          </div>

          <div class="detail-block">
            <strong>Attachments</strong>
            <div class="form-stack" style="margin-top:10px;">
              <input id="attachment-file" type="file">
              <label class="muted"><input type="checkbox" id="attachment-internal" ${currentDetail.permissions?.can_add_internal_note ? '' : 'disabled'}> Internal attachment</label>
              <div class="inline-actions">
                <button class="btn" onclick="submitAttachment()">Upload Attachment</button>
                <span class="muted">Allowed types: PDF, PNG, JPG, WEBP, TXT, DOCX, XLSX.</span>
              </div>
            </div>
            <div class="attachment-list">
              ${renderAttachments(currentDetail.attachments)}
            </div>
          </div>

          <div class="detail-block">
            <strong>Timeline</strong>
            <div class="timeline-list">
              ${renderTimeline(currentDetail.history)}
            </div>
          </div>
        </div>
      `;

      loadAssetOptions();
      loadTicketDetailSuggestions();
    }

    function renderKnowledgeSuggestions(articles, targetId) {
      const root = document.getElementById(targetId);
      if (!root) return;
      root.innerHTML = articles.length
        ? articles.map((article) => `
          <div class="suggestion-card">
            <strong>${escapeHtml(article.title)}</strong>
            <div>${escapeHtml(article.summary || 'No summary available.')}</div>
            <small>${escapeHtml(article.category || 'General')} | Helpful: ${Number(article.helpful_count || 0)} | Score: ${Number(article.suggestion_score || 0)}</small>
            <button class="link-btn" onclick="window.location.href='/knowledge-base.html#article-${article.article_id}'">Open article</button>
          </div>
        `).join('')
        : UiFeedback.renderMuted('No matching knowledge-base suggestions yet.');
    }

    async function loadTicketCreationSuggestions() {
      const params = new URLSearchParams({
        category: document.getElementById('category').value || '',
        subcategory: document.getElementById('subcategory').value || '',
        subject: document.getElementById('subject').value || '',
        description: document.getElementById('description').value || '',
        affected_asset_id: document.getElementById('affected_asset_id').value || '',
        limit: '5',
      });
      try {
        const suggestions = await api(`/knowledge-base/suggestions?${params.toString()}`);
        renderKnowledgeSuggestions(suggestions, 'ticket-suggestions');
      } catch (err) {
        renderKnowledgeSuggestions([], 'ticket-suggestions');
      }
    }

    async function loadTicketDetailSuggestions() {
      if (!currentDetail) return;
      const params = new URLSearchParams({
        category: currentDetail.category || '',
        subcategory: currentDetail.subcategory || '',
        subject: currentDetail.subject || '',
        description: currentDetail.description || '',
        affected_asset_id: currentDetail.affected_asset_id || '',
        limit: '5',
      });
      try {
        const suggestions = await api(`/knowledge-base/suggestions?${params.toString()}`);
        renderKnowledgeSuggestions(suggestions, 'detail-suggestions');
      } catch (err) {
        renderKnowledgeSuggestions([], 'detail-suggestions');
      }
    }

    document.getElementById('new-form').addEventListener('submit', async (event) => {
      event.preventDefault();
      const body = {
        ticket_type: document.getElementById('ticket_type').value,
        category: document.getElementById('category').value,
        subcategory: document.getElementById('subcategory').value.trim(),
        priority: document.getElementById('priority').value,
        impact: document.getElementById('impact').value,
        urgency: document.getElementById('urgency').value,
        subject: document.getElementById('subject').value.trim(),
        description: document.getElementById('description').value.trim(),
        affected_asset_id: document.getElementById('affected_asset_id').value || null,
        closure_confirmation_required: document.getElementById('closure_confirmation_required').checked,
      };

      try {
        const created = await api('/service-requests', { method: 'POST', body });
        closeNewModal();
        await load();
        await selectTicket(created.request_id);
      } catch (err) {
        UiFeedback.setBox('new-error', err.message);
      }
    });

    async function openAssign(id) {
      activeAssignId = id;
      try {
        const techs = await api('/staff/technicians');
        document.getElementById('tech-select').innerHTML = [
          '<option value="">Unassigned</option>',
          ...techs.map((tech) => `<option value="${tech.user_id}">${escapeHtml(tech.full_name)}</option>`),
        ].join('');
        document.getElementById('assignment_note').value = '';
        document.getElementById('expected_completion_at').value = currentDetail?.expected_completion_at
          ? new Date(currentDetail.expected_completion_at).toISOString().slice(0, 16)
          : '';
        UiModals.open('assign-modal');
      } catch (err) {
        alert(err.message);
      }
    }

    async function confirmAssign() {
      const techId = document.getElementById('tech-select').value;
      const assignmentNote = document.getElementById('assignment_note').value.trim();
      const expectedCompletionAt = document.getElementById('expected_completion_at').value;
      try {
        await api(`/service-requests/${activeAssignId}/assign`, {
          method: 'PATCH',
          body: {
            assigned_technician_id: techId,
            assignment_note: assignmentNote,
            expected_completion_at: expectedCompletionAt || null,
          },
        });
        UiModals.close('assign-modal');
        await load();
        if (selectedTicketId === activeAssignId) {
          await selectTicket(activeAssignId);
        }
      } catch (err) {
        alert(err.message);
      }
    }

    async function submitAffectedAssetUpdate() {
      if (!selectedTicketId) return;
      try {
        await api(`/service-requests/${selectedTicketId}/affected-asset`, {
          method: 'PATCH',
          body: {
            affected_asset_id: document.getElementById('detail-affected-asset').value || null,
          },
        });
        await selectTicket(selectedTicketId);
      } catch (err) {
        alert(err.message);
      }
    }

    async function submitStatusChange() {
      if (!selectedTicketId) return;
      const status = document.getElementById('status-select').value;
      if (!status) {
        alert('Choose a target status first.');
        return;
      }
      try {
        await api(`/service-requests/${selectedTicketId}/status`, {
          method: 'PATCH',
          body: {
            status,
            note: document.getElementById('status-note').value.trim(),
            resolution: document.getElementById('status-resolution').value.trim(),
          },
        });
        await load();
        await selectTicket(selectedTicketId);
      } catch (err) {
        alert(err.message);
      }
    }

    async function submitComment() {
      if (!selectedTicketId) return;
      const commentBody = document.getElementById('comment-body').value.trim();
      if (!commentBody) {
        alert('Enter a comment first.');
        return;
      }
      try {
        await api(`/service-requests/${selectedTicketId}/comments`, {
          method: 'POST',
          body: {
            comment_body: commentBody,
            is_internal: document.getElementById('comment-internal').checked,
          },
        });
        await selectTicket(selectedTicketId);
      } catch (err) {
        alert(err.message);
      }
    }

    function readFileAsDataUrl(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = () => reject(new Error('Failed to read file.'));
        reader.readAsDataURL(file);
      });
    }

    async function submitAttachment() {
      if (!selectedTicketId) return;
      const input = document.getElementById('attachment-file');
      const file = input.files[0];
      if (!file) {
        alert('Choose a file first.');
        return;
      }
      try {
        const contentBase64 = await readFileAsDataUrl(file);
        await api(`/service-requests/${selectedTicketId}/attachments`, {
          method: 'POST',
          body: {
            file_name: file.name,
            mime_type: file.type || 'application/octet-stream',
            content_base64: contentBase64,
            is_internal: document.getElementById('attachment-internal').checked,
          },
        });
        input.value = '';
        await selectTicket(selectedTicketId);
      } catch (err) {
        alert(err.message);
      }
    }

    async function downloadAttachment(attachmentId, fileName) {
      if (!selectedTicketId) return;
      try {
        const blob = await apiBlob(`/service-requests/${selectedTicketId}/attachments/${attachmentId}/download`);
        downloadBlob(blob, fileName);
      } catch (err) {
        alert(err.message);
      }
    }

    async function init() {
      await loadMetadata();
      renderContent();
      await load();
    }

    init();
  </script>
</body>
</html>
