<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>My Assigned Requests - NSC ICT Service Desk</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="app-shell" id="app-shell"></div>

  <div class="modal-overlay" id="update-modal">
    <div class="modal" style="position:relative;">
      <span class="close-x" onclick="closeUpdateModal()">&times;</span>
      <h3 id="update-title">Update Request</h3>
      <div class="error-box" id="update-error"></div>
      <div class="field"><label>Status</label>
        <select id="update-status">
          <option>Assigned</option><option>In Progress</option><option>Resolved</option><option>Closed</option>
        </select>
      </div>
      <div class="field"><label>Troubleshooting Notes / Resolution</label>
        <textarea id="update-resolution" rows="4" placeholder="Describe the action taken..."></textarea>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn secondary" onclick="closeUpdateModal()">Cancel</button>
        <button type="button" class="btn" id="update-save-btn" onclick="saveUpdate()">Save Update</button>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/ui/badges.js"></script>
  <script src="/js/ui/feedback.js"></script>
  <script src="/js/ui/modals.js"></script>
  <script src="/js/ui/states.js"></script>
  <script src="/js/ui/tables.js"></script>
  <script>
    requireRoutePage('technician');
    renderLayout('technician', 'My Assigned Requests', 'Assigned ticket execution and resolution workspace');

    let activeId = null;

    function showPageError(message) {
      UiFeedback.setBox('page-error', message);
      UiFeedback.clearBox('page-success');
    }

    function showPageSuccess(message) {
      UiFeedback.setBox('page-success', message);
      UiFeedback.clearBox('page-error');
    }

    function clearPageFeedback() {
      UiFeedback.clearBox('page-error');
      UiFeedback.clearBox('page-success');
    }

    function renderContent() {
      document.getElementById('page-content').innerHTML = `
        <div class="panel">
          <div class="error-box" id="page-error"></div>
          <div class="success-box" id="page-success"></div>
          <div class="section-title" style="margin-top:0;">Open & In-Progress Requests</div>
          <div class="table-wrap"><table>
            <thead><tr><th>ID</th><th>Subject</th><th>Requester</th><th>Priority</th><th>Status</th><th>Submitted</th><th>Actions</th></tr></thead>
            <tbody id="open-rows"></tbody>
          </table></div>
          <div id="open-empty" class="empty-state" style="display:none;">No open requests assigned to you.</div>

          <div class="section-title">Previously Completed Requests</div>
          <div class="table-wrap"><table>
            <thead><tr><th>ID</th><th>Subject</th><th>Requester</th><th>Resolution</th><th>Resolved</th></tr></thead>
            <tbody id="done-rows"></tbody>
          </table></div>
          <div id="done-empty" class="empty-state" style="display:none;">No completed requests yet.</div>
        </div>
      `;
    }

    function renderTableLoadState(bodyId, emptyId, columnCount, message) {
      const body = document.getElementById(bodyId);
      const empty = document.getElementById(emptyId);
      if (body) body.innerHTML = `<tr><td colspan="${columnCount}">${UiStates.loading(message)}</td></tr>`;
      if (empty) empty.style.display = 'none';
    }

    function renderOpenRow(request) {
      return `
        <tr>
          <td>#${request.request_id}</td>
          <td>${escapeHtml(request.subject)}</td>
          <td>${escapeHtml(request.requester_name)}</td>
          <td>${UiBadges.renderPriority(request.priority)}</td>
          <td>${UiBadges.renderStatus(request.status)}</td>
          <td>${fmtDate(request.date_submitted)}</td>
          <td><button class="link-btn" onclick='openUpdate(${request.request_id}, ${JSON.stringify(request.status)})'>Update</button></td>
        </tr>
      `;
    }

    function renderCompletedRow(request) {
      return `
        <tr>
          <td>#${request.request_id}</td>
          <td>${escapeHtml(request.subject)}</td>
          <td>${escapeHtml(request.requester_name)}</td>
          <td>${escapeHtml(request.resolution || '-')}</td>
          <td>${fmtDate(request.date_resolved)}</td>
        </tr>
      `;
    }

    async function load() {
      renderTableLoadState('open-rows', 'open-empty', 7, 'Loading assigned requests...');
      renderTableLoadState('done-rows', 'done-empty', 5, 'Loading completed requests...');

      try {
        const list = await api('/service-requests/assigned-to-me');
        const open = list.filter((request) => !['Resolved', 'Closed'].includes(request.status));
        const done = list.filter((request) => ['Resolved', 'Closed'].includes(request.status));

        clearPageFeedback();
        UiTables.renderBody('open-rows', 'open-empty', open.map(renderOpenRow).join(''), 'No open requests assigned to you.');
        UiTables.renderBody('done-rows', 'done-empty', done.map(renderCompletedRow).join(''), 'No completed requests yet.');
      } catch (err) {
        showPageError(err.message);
        document.getElementById('open-rows').innerHTML = `<tr><td colspan="7">${UiStates.error(err.message)}</td></tr>`;
        document.getElementById('done-rows').innerHTML = `<tr><td colspan="5">${UiStates.error(err.message)}</td></tr>`;
      }
    }

    function closeUpdateModal() {
      UiModals.close('update-modal');
      UiFeedback.clearBox('update-error');
    }

    function openUpdate(id, currentStatus) {
      activeId = id;
      document.getElementById('update-title').textContent = `Update Request #${id}`;
      document.getElementById('update-status').value = currentStatus === 'Pending' ? 'Assigned' : currentStatus;
      document.getElementById('update-resolution').value = '';
      UiFeedback.clearBox('update-error');
      UiModals.open('update-modal');
    }

    async function saveUpdate() {
      const status = document.getElementById('update-status').value;
      const resolution = document.getElementById('update-resolution').value.trim();
      const saveButton = document.getElementById('update-save-btn');
      const originalLabel = saveButton.textContent;

      UiFeedback.clearBox('update-error');
      saveButton.disabled = true;
      saveButton.textContent = 'Saving...';

      try {
        await api(`/service-requests/${activeId}/status`, { method: 'PATCH', body: { status, resolution } });
        closeUpdateModal();
        await load();
        showPageSuccess(`Request #${activeId} updated successfully.`);
      } catch (err) {
        UiFeedback.setBox('update-error', err.message);
      } finally {
        saveButton.disabled = false;
        saveButton.textContent = originalLabel;
      }
    }

    renderContent();
    load();
  </script>
</body>
</html>
