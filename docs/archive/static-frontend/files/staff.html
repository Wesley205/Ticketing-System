<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Staff Management - NSC ICT Service Desk</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="app-shell" id="app-shell"></div>

  <div class="modal-overlay" id="s-modal">
    <div class="modal" style="position:relative;">
      <span class="close-x" onclick="closeStaffModal()">&times;</span>
      <h3 id="s-title">Add Account</h3>
      <div class="error-box" id="s-error"></div>
      <form id="s-form">
        <input type="hidden" id="user_id">
        <div class="form-grid">
          <div class="field full"><label>Full Name *</label><input id="full_name" required></div>
          <div class="field"><label>Email *</label><input type="email" id="email" required></div>
          <div class="field"><label>Username *</label><input id="username" required></div>
          <div class="field" id="password-field"><label>Password *</label><input type="password" id="password" minlength="6"></div>
          <div class="field"><label>Role *</label>
            <select id="role"><option value="staff">Staff/User</option><option value="technician">Technician</option><option value="ict_officer">ICT Officer</option><option value="admin">Administrator</option></select>
          </div>
          <div class="field"><label>User Type *</label>
            <select id="user_type" onchange="toggleLifecycleFields(this.value)">
              <option value="employee">Employee</option>
              <option value="intern">Intern</option>
              <option value="corper">Corper</option>
              <option value="contractor">Contractor</option>
              <option value="guest">Guest</option>
            </select>
          </div>
          <div class="field"><label>Department</label><select id="department_id"><option value="">- None -</option></select></div>
          <div class="field"><label>Phone</label><input id="phone"></div>
          <div class="field"><label>Account Start Date</label><input type="date" id="account_start_date"></div>
          <div class="field"><label>Account Expiration Date</label><input type="date" id="account_expiration_date"></div>
          <div class="field full"><label>Sponsor or Supervisor</label><input id="sponsor_name" placeholder="Required for temporary users"></div>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn secondary" onclick="closeStaffModal()">Cancel</button>
          <button type="submit" class="btn">Save</button>
        </div>
      </form>
    </div>
  </div>

  <div class="modal-overlay" id="i-modal">
    <div class="modal" style="position:relative;">
      <span class="close-x" onclick="closeInviteModal()">&times;</span>
      <h3>Issue Invitation</h3>
      <div class="error-box" id="i-error"></div>
      <form id="i-form">
        <div class="form-grid">
          <div class="field full"><label>Full Name *</label><input id="i_full_name" required></div>
          <div class="field"><label>Email *</label><input type="email" id="i_email" required></div>
          <div class="field"><label>Preferred Username</label><input id="i_username"></div>
          <div class="field"><label>Role *</label>
            <select id="i_role"><option value="staff">Staff/User</option><option value="technician">Technician</option><option value="ict_officer">ICT Officer</option><option value="admin">Administrator</option></select>
          </div>
          <div class="field"><label>User Type *</label>
            <select id="i_user_type" onchange="toggleInviteLifecycleFields(this.value)">
              <option value="employee">Employee</option>
              <option value="intern">Intern</option>
              <option value="corper">Corper</option>
              <option value="contractor">Contractor</option>
              <option value="guest">Guest</option>
            </select>
          </div>
          <div class="field"><label>Department</label><select id="i_department_id"><option value="">- None -</option></select></div>
          <div class="field"><label>Account Start Date</label><input type="date" id="i_account_start_date"></div>
          <div class="field"><label>Account Expiration Date</label><input type="date" id="i_account_expiration_date"></div>
          <div class="field"><label>Invitation Expires In (days)</label><input type="number" id="i_expires_in_days" min="1" value="7"></div>
          <div class="field full"><label>Sponsor or Supervisor</label><input id="i_sponsor_name" placeholder="Required for temporary users"></div>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn secondary" onclick="closeInviteModal()">Cancel</button>
          <button type="submit" class="btn">Create Invitation</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/permissions.js"></script>
  <script src="/js/ui/badges.js"></script>
  <script src="/js/ui/feedback.js"></script>
  <script src="/js/ui/modals.js"></script>
  <script src="/js/ui/states.js"></script>
  <script src="/js/ui/tables.js"></script>
  <script>
    requireRoutePage('staff');
    renderLayout('staff', 'Staff Management', 'Account lifecycle, invitations, and internal directory');

    const user = getUser();
    const isAdmin = hasPermission('can_access_admin_portal');
    const userTypeLabels = { employee: 'Employee', intern: 'Intern', corper: 'Corper', contractor: 'Contractor', guest: 'Guest' };
    const roleLabels = { admin: 'Administrator', ict_officer: 'ICT Officer', technician: 'Technician', staff: 'Staff/User' };

    function showPageError(message) {
      UiFeedback.setBox('page-error', message);
      UiFeedback.clearBox('page-success');
    }

    function showPageSuccess(message) {
      UiFeedback.setBox('page-success', message);
      UiFeedback.clearBox('page-error');
    }

    function clearPageError() {
      UiFeedback.clearBox('page-error');
    }

    function renderContent() {
      document.getElementById('page-content').innerHTML = `
        <div class="panel">
          <div class="error-box" id="page-error"></div>
          <div class="success-box" id="page-success"></div>
          <div class="toolbar">
            <div class="filters">
              <input type="text" id="search" placeholder="Search name, email, username...">
              <select id="filter-role">
                <option value="">All Roles</option>
                <option value="admin">Administrator</option>
                <option value="ict_officer">ICT Officer</option>
                <option value="technician">Technician</option>
                <option value="staff">Staff/User</option>
              </select>
              <select id="filter-user-type">
                <option value="">All User Types</option>
                <option value="employee">Employee</option>
                <option value="intern">Intern</option>
                <option value="corper">Corper</option>
                <option value="contractor">Contractor</option>
                <option value="guest">Guest</option>
              </select>
            </div>
            ${isAdmin ? '<div style="display:flex; gap:10px;"><button class="btn secondary" onclick="openInvite()">+ Issue Invitation</button><button class="btn" onclick="openNew()">+ Add Account</button></div>' : ''}
          </div>
          ${isAdmin ? '' : '<div class="muted" style="margin-bottom:16px;">You can view the internal directory but cannot create, invite, deactivate, or extend accounts with your current access scope.</div>'}
          <div class="table-wrap"><table>
            <thead><tr><th>Name</th><th>Email</th><th>User Type</th><th>Role</th><th>Department</th><th>Expiry</th><th>Status</th><th>Actions</th></tr></thead>
            <tbody id="rows"></tbody>
          </table></div>
          <div id="empty" class="empty-state" style="display:none;">No staff found.</div>
        </div>

        ${isAdmin ? `
        <div class="panel" style="margin-top:22px;">
          <div class="toolbar">
            <h3 style="margin:0;">Pending Invitations</h3>
            <button class="btn secondary small" onclick="loadInvitations()">Refresh</button>
          </div>
          <div class="table-wrap"><table>
            <thead><tr><th>Name</th><th>Email</th><th>User Type</th><th>Role</th><th>Expiry</th><th>Status</th><th>Actions</th></tr></thead>
            <tbody id="invite-rows"></tbody>
          </table></div>
          <div id="invite-empty" class="empty-state" style="display:none;">No invitations found.</div>
        </div>` : ''}
      `;

      document.getElementById('search').addEventListener('input', debounce(loadStaff, 350));
      document.getElementById('filter-role').addEventListener('change', loadStaff);
      document.getElementById('filter-user-type').addEventListener('change', loadStaff);
    }

    function debounce(fn, ms) {
      let t;
      return (...a) => {
        clearTimeout(t);
        t = setTimeout(() => fn(...a), ms);
      };
    }

    function isTemporaryUser(type) {
      return ['intern', 'corper', 'contractor', 'guest'].includes(type);
    }

    function renderTableLoadState(bodyId, emptyId, columnCount, message) {
      const body = document.getElementById(bodyId);
      const empty = document.getElementById(emptyId);
      if (body) body.innerHTML = `<tr><td colspan="${columnCount}">${UiStates.loading(message)}</td></tr>`;
      if (empty) empty.style.display = 'none';
    }

    let departments = [];
    async function loadDepartments() {
      try {
        departments = await api('/departments');
        const options = departments.map((d) => `<option value="${d.department_id}">${escapeHtml(d.name)}</option>`).join('');
        document.getElementById('department_id').innerHTML += options;
        document.getElementById('i_department_id').innerHTML += options;
      } catch (err) {
        showPageError(err.message);
      }
    }

    function toggleLifecycleFields(type) {
      const sponsor = document.getElementById('sponsor_name');
      const expiry = document.getElementById('account_expiration_date');
      sponsor.required = isTemporaryUser(type);
      expiry.required = isTemporaryUser(type);
    }

    function toggleInviteLifecycleFields(type) {
      const sponsor = document.getElementById('i_sponsor_name');
      const expiry = document.getElementById('i_account_expiration_date');
      sponsor.required = isTemporaryUser(type);
      expiry.required = isTemporaryUser(type);
    }

    function renderStaffActions(staff) {
      if (!isAdmin) return '';
      return `
        <button class="link-btn" onclick='editStaff(${JSON.stringify(staff)})'>Edit</button> ·
        <button class="link-btn" onclick="toggleActive(${staff.user_id}, ${!staff.is_active})">${staff.is_active ? 'Deactivate' : 'Activate'}</button>
        ${staff.user_type !== 'employee' ? `· <button class="link-btn" onclick="extendAccount(${staff.user_id})">Extend</button>` : ''}
      `;
    }

    function renderStaffRow(staff) {
      return `
        <tr>
          <td>${escapeHtml(staff.full_name)}</td>
          <td>${escapeHtml(staff.email)}</td>
          <td>${escapeHtml(userTypeLabels[staff.user_type] || staff.user_type || '-')}</td>
          <td>${escapeHtml(roleLabels[staff.role] || staff.role)}</td>
          <td>${escapeHtml(staff.department_name || '-')}</td>
          <td>${escapeHtml(fmtDate(staff.account_expiration_date))}</td>
          <td>${staff.is_active ? UiBadges.renderStatus('Active') : UiBadges.renderBadge('Inactive', 'status-Damaged')}</td>
          <td>${renderStaffActions(staff)}</td>
        </tr>
      `;
    }

    function renderInvitationRow(invitation) {
      return `
        <tr>
          <td>${escapeHtml(invitation.full_name)}</td>
          <td>${escapeHtml(invitation.email)}</td>
          <td>${escapeHtml(userTypeLabels[invitation.user_type] || invitation.user_type)}</td>
          <td>${escapeHtml(roleLabels[invitation.role] || invitation.role)}</td>
          <td>${escapeHtml(fmtDate(invitation.expires_at))}</td>
          <td>${UiBadges.renderStatus(invitation.status)}</td>
          <td>${invitation.status === 'pending' ? `<button class="link-btn" onclick="revokeInvitation(${invitation.invitation_id})">Revoke</button>` : '-'}</td>
        </tr>
      `;
    }

    async function loadStaff() {
      const params = new URLSearchParams();
      const search = document.getElementById('search').value.trim();
      const role = document.getElementById('filter-role').value;
      const userType = document.getElementById('filter-user-type').value;
      if (search) params.set('search', search);
      if (role) params.set('role', role);
      if (userType) params.set('user_type', userType);

      renderTableLoadState('rows', 'empty', 8, 'Loading staff directory...');

      try {
        const list = await api(`/staff?${params.toString()}`);
        clearPageError();
        UiTables.renderBody('rows', 'empty', list.map(renderStaffRow).join(''), 'No staff found.');
      } catch (err) {
        showPageError(err.message);
        document.getElementById('rows').innerHTML = `<tr><td colspan="8">${UiStates.error(err.message)}</td></tr>`;
      }
    }

    async function loadInvitations() {
      if (!isAdmin) return;

      renderTableLoadState('invite-rows', 'invite-empty', 7, 'Loading invitations...');

      try {
        const list = await api('/invitations');
        clearPageError();
        UiTables.renderBody('invite-rows', 'invite-empty', list.map(renderInvitationRow).join(''), 'No invitations found.');
      } catch (err) {
        showPageError(err.message);
        document.getElementById('invite-rows').innerHTML = `<tr><td colspan="7">${UiStates.error(err.message)}</td></tr>`;
      }
    }

    function closeStaffModal() {
      UiModals.close('s-modal');
      document.getElementById('username').disabled = false;
    }

    function closeInviteModal() {
      UiModals.close('i-modal');
    }

    function openNew() {
      document.getElementById('s-title').textContent = 'Add Account';
      document.getElementById('s-form').reset();
      document.getElementById('user_id').value = '';
      document.getElementById('password-field').style.display = 'block';
      document.getElementById('password').required = true;
      document.getElementById('username').disabled = false;
      document.getElementById('user_type').value = 'employee';
      toggleLifecycleFields('employee');
      UiFeedback.clearBox('s-error');
      UiModals.open('s-modal');
    }

    function openInvite() {
      document.getElementById('i-form').reset();
      document.getElementById('i_user_type').value = 'employee';
      toggleInviteLifecycleFields('employee');
      UiFeedback.clearBox('i-error');
      UiModals.open('i-modal');
    }

    function editStaff(s) {
      document.getElementById('s-title').textContent = `Edit - ${s.full_name}`;
      document.getElementById('user_id').value = s.user_id;
      document.getElementById('full_name').value = s.full_name;
      document.getElementById('email').value = s.email;
      document.getElementById('username').value = s.username;
      document.getElementById('username').disabled = true;
      document.getElementById('password-field').style.display = 'none';
      document.getElementById('password').required = false;
      document.getElementById('role').value = s.role;
      document.getElementById('user_type').value = s.user_type || 'employee';
      document.getElementById('department_id').value = s.department_id || '';
      document.getElementById('phone').value = s.phone || '';
      document.getElementById('account_start_date').value = s.account_start_date ? String(s.account_start_date).slice(0, 10) : '';
      document.getElementById('account_expiration_date').value = s.account_expiration_date ? String(s.account_expiration_date).slice(0, 10) : '';
      document.getElementById('sponsor_name').value = s.sponsor_name || '';
      toggleLifecycleFields(s.user_type || 'employee');
      UiFeedback.clearBox('s-error');
      UiModals.open('s-modal');
    }

    document.getElementById('s-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const id = document.getElementById('user_id').value;

      const body = {
        full_name: document.getElementById('full_name').value.trim(),
        email: document.getElementById('email').value.trim(),
        role: document.getElementById('role').value,
        user_type: document.getElementById('user_type').value,
        department_id: document.getElementById('department_id').value || null,
        phone: document.getElementById('phone').value.trim(),
        sponsor_name: document.getElementById('sponsor_name').value.trim(),
        account_start_date: document.getElementById('account_start_date').value || null,
        account_expiration_date: document.getElementById('account_expiration_date').value || null,
      };

      if (!id) {
        body.username = document.getElementById('username').value.trim();
        body.password = document.getElementById('password').value;
      }

      UiFeedback.clearBox('s-error');
      const submitButton = e.target.querySelector('button[type="submit"]');
      const originalLabel = submitButton ? submitButton.textContent : '';
      if (submitButton) {
        submitButton.disabled = true;
        submitButton.textContent = 'Saving...';
      }

      try {
        await api(id ? `/staff/${id}` : '/staff', { method: id ? 'PUT' : 'POST', body });
        closeStaffModal();
        await loadStaff();
        showPageSuccess(id ? 'Account updated successfully.' : 'Account created successfully.');
      } catch (err) {
        UiFeedback.setBox('s-error', err.message);
      } finally {
        if (submitButton) {
          submitButton.disabled = false;
          submitButton.textContent = originalLabel;
        }
      }
    });

    document.getElementById('i-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const body = {
        full_name: document.getElementById('i_full_name').value.trim(),
        email: document.getElementById('i_email').value.trim(),
        preferred_username: document.getElementById('i_username').value.trim() || null,
        role: document.getElementById('i_role').value,
        user_type: document.getElementById('i_user_type').value,
        department_id: document.getElementById('i_department_id').value || null,
        sponsor_name: document.getElementById('i_sponsor_name').value.trim(),
        account_start_date: document.getElementById('i_account_start_date').value || null,
        account_expiration_date: document.getElementById('i_account_expiration_date').value || null,
        expires_in_days: document.getElementById('i_expires_in_days').value || 7,
      };

      UiFeedback.clearBox('i-error');
      const submitButton = e.target.querySelector('button[type="submit"]');
      const originalLabel = submitButton ? submitButton.textContent : '';
      if (submitButton) {
        submitButton.disabled = true;
        submitButton.textContent = 'Creating...';
      }

      try {
        const invitation = await api('/invitations', { method: 'POST', body });
        closeInviteModal();
        window.prompt('Copy and share this invitation URL. It is shown only once.', invitation.acceptance_url);
        await loadInvitations();
        showPageSuccess('Invitation created successfully.');
      } catch (err) {
        UiFeedback.setBox('i-error', err.message);
      } finally {
        if (submitButton) {
          submitButton.disabled = false;
          submitButton.textContent = originalLabel;
        }
      }
    });

    async function toggleActive(id, newState) {
      const deactivationReason = newState ? null : window.prompt('Deactivation reason', 'Account access revoked by administrator');
      if (!newState && deactivationReason === null) return;
      try {
        await api(`/staff/${id}/status`, { method: 'PATCH', body: { is_active: newState, deactivation_reason: deactivationReason } });
        await loadStaff();
        showPageSuccess(newState ? 'Account activated successfully.' : 'Account deactivated successfully.');
      } catch (err) {
        showPageError(err.message);
      }
    }

    async function extendAccount(id) {
      const newDate = window.prompt('Enter the new expiration date (YYYY-MM-DD)');
      if (!newDate) return;
      try {
        await api(`/staff/${id}/extend`, { method: 'PATCH', body: { account_expiration_date: newDate } });
        await loadStaff();
        showPageSuccess('Temporary account extended successfully.');
      } catch (err) {
        showPageError(err.message);
      }
    }

    async function revokeInvitation(id) {
      if (!confirm('Revoke this pending invitation?')) return;
      try {
        await api(`/invitations/${id}/revoke`, { method: 'POST' });
        await loadInvitations();
        showPageSuccess('Invitation revoked successfully.');
      } catch (err) {
        showPageError(err.message);
      }
    }

    (async () => {
      renderContent();
      await loadDepartments();
      await loadStaff();
      await loadInvitations();
    })();
  </script>
</body>
</html>
