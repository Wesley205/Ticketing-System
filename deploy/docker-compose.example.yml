services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: nsc_ict_system
      POSTGRES_USER: nsc_app
      POSTGRES_PASSWORD: ${NSC_DB_PASSWORD:?set NSC_DB_PASSWORD} # pragma: allowlist secret
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nsc_app -d nsc_ict_system"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      INTERNAL_APP_BASE_URL: ${NSC_INTERNAL_APP_BASE_URL:-http://localhost:5000}
      CORS_ALLOWED_ORIGINS: ${NSC_CORS_ALLOWED_ORIGINS:-http://localhost:5000}
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: nsc_ict_system
      PGUSER: nsc_app
      PGPASSWORD: ${NSC_DB_PASSWORD:?set NSC_DB_PASSWORD} # pragma: allowlist secret
      DB_SSL: "false"
      JWT_SECRET: ${NSC_JWT_SECRET:?set NSC_JWT_SECRET} # pragma: allowlist secret
      EMAIL_DELIVERY_MODE: ${NSC_EMAIL_DELIVERY_MODE:-}
      EMAIL_FROM_ADDRESS: ${NSC_EMAIL_FROM_ADDRESS:-}
      SMTP_HOST: ${NSC_SMTP_HOST:-}
      SMTP_PORT: ${NSC_SMTP_PORT:-587}
      SMTP_SECURE: ${NSC_SMTP_SECURE:-false}
      SMTP_USER: ${NSC_SMTP_USER:-}
      SMTP_PASS: ${NSC_SMTP_PASS:-} # pragma: allowlist secret
      WEB_PUSH_VAPID_PUBLIC_KEY: ${NSC_WEB_PUSH_VAPID_PUBLIC_KEY:-}
      WEB_PUSH_VAPID_PRIVATE_KEY: ${NSC_WEB_PUSH_VAPID_PRIVATE_KEY:-} # pragma: allowlist secret
      WEB_PUSH_CONTACT_EMAIL: ${NSC_WEB_PUSH_CONTACT_EMAIL:-admin@nscict.local}
      ORGANIZATION_EMAIL_DOMAINS: nscict.local
    volumes:
      - attachment-data:/app/storage/ticket-attachments

volumes:
  postgres-data:
  attachment-data:
